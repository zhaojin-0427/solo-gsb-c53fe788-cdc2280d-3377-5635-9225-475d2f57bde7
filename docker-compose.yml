services:
  obligation-desk:
    build: .
    image: obligation-desk:latest
    container_name: obligation-desk
    ports:
      - "8000:8000"
    volumes:
      - obligation-data:/data
    environment:
      DB_PATH: /data/obligations.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  obligation-data:
